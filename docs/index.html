<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="いろは48文字の上杉暗号を、標準表・数字鍵・かな鍵で体験できる暗号化・復号ツールです。">
  <title>字変四十八の上杉暗号ツール</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>字変四十八の上杉暗号ツール</h1>
    <button id="themeToggle" class="theme-toggle" aria-label="ダークモードに切り替え" aria-pressed="false">🌙</button>
  </header>
  <noscript>このツールを使うには、ブラウザーのJavaScriptを有効にしてください。</noscript>
  <main class="app">
  <section class="work-area" aria-label="暗号の入力と結果">

  <div class="input-section">
    <label for="inputText">入力:</label>
    <textarea id="inputText" rows="2" placeholder="例: てきみゆ（濁点・カタカナは清音のひらがなに自動変換します）"></textarea>
    <p class="input-hint">空白は省き、改行は残します。入力は10,000文字までです。</p>
  </div>

  <h2 class="settings-heading">設定</h2>
  <div class="controls">
    <fieldset class="mode-toggle">
      <legend>モード切替</legend>
      <label><input type="radio" name="mode" value="encrypt" checked> 暗号化</label>
      <label><input type="radio" name="mode" value="decrypt"> 復号</label>
    </fieldset>

    <fieldset class="mode-toggle" id="notationGroup" aria-describedby="notationHint">
      <legend>数字表記（暗号化の出力と表の見出し）</legend>
      <label><input type="radio" name="numeral" value="arabic" checked> アラビア数字</label>
      <label><input type="radio" name="numeral" value="kanji"> 漢数字</label>
      <p id="notationHint" class="input-hint" hidden>かなの鍵では数字表記を使いません。</p>
    </fieldset>
  </div>

  <fieldset class="mode-toggle key-settings">
    <legend>鍵</legend>
    <div class="key-modes">
      <label><input type="radio" name="keyMode" value="standard" checked>標準（鍵なし）</label>
      <label><input type="radio" name="keyMode" value="numeric">数字の並べ替え</label>
      <label><input type="radio" name="keyMode" value="kana">かな7文字×2（和歌の下の句など）</label>
    </div>
    <div id="keyFields" hidden>
      <div class="key-inputs">
        <div>
          <label for="colKey">列の鍵（右の列から順に）</label>
          <input id="colKey" type="text" autocomplete="off" spellcheck="false" aria-describedby="colKeyMessage">
          <p id="colKeyMessage" class="key-message" aria-live="polite"></p>
        </div>
        <div>
          <label for="rowKey">行の鍵（上の行から順に）</label>
          <input id="rowKey" type="text" autocomplete="off" spellcheck="false" aria-describedby="rowKeyMessage">
          <p id="rowKeyMessage" class="key-message" aria-live="polite"></p>
        </div>
      </div>
      <div class="key-actions">
        <button id="keyExampleBtn" class="copy-btn">例を入れる</button>
        <button id="keyRandomBtn" class="copy-btn">ランダムに作る</button>
      </div>
      <p id="kanaExampleHint" class="input-hint" hidden>かなの例は阿倍仲麻呂の歌の下の句です。重複のない句の例として選んだもので、史料に載っている鍵ではありません。</p>
    </div>
  </fieldset>
  <button class="execute-btn" id="runBtn">実行</button>

  <div class="result-section">
    <div class="result-header">
      <h2>結果</h2>
      <button class="copy-btn" id="swapBtn" disabled>結果を入力に送る</button>
      <button class="copy-btn" id="copyBtn" disabled>
        📋 コピー
      </button>
    </div>
    <div class="result-message" id="resultMessage" aria-live="polite"></div>
    <div class="output-area" id="outputText" aria-live="polite" tabindex="0"></div>
  </div>
  </section>
  <section class="table-container" aria-labelledby="matrixHeading">
    <h2 id="matrixHeading">換字表</h2>
    <div id="matrix"></div>
    <p class="input-hint">右上から縦に並べ、列→行の順に読みます。列7・行7は空きマスです。</p>
  </section>
  </main>

  <div class="divider"></div>

  <footer class="footer">
    🔗 GitHubリポジトリーはこちら（<a href="https://github.com/ipusiron/uesugi-cipher" target="_blank" rel="noopener noreferrer">ipusiron/uesugi-cipher</a>）
  </footer>

  <script src="js/uesugi-logic.js" defer></script>
  <script src="js/script.js" defer></script>
</body>
</html>
